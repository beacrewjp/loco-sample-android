apply plugin: 'com.android.application'
apply plugin: 'realm-android'

android {
    namespace = 'jp.beacrew.locotutorial'
    compileSdkVersion 37

    defaultConfig {
        applicationId "jp.beacrew.locotutorial"
        minSdkVersion 26
        targetSdkVersion 37
        versionCode 1
        versionName "1.0"
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets{
        main{
            assets.srcDirs=["src/main/assets"]
        }
    }
}
repositories {
    maven {
        url = 'https://github.com/beacrewjp/loco-sdk-android-distribution/raw/master/maven/maven-repo'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'jp.beacrew:loco:2.9.0@aar'

    implementation('org.altbeacon:android-beacon-library:2.21.2') {
        exclude module: 'support-v4'
    }
    implementation('com.squareup.okhttp3:okhttp:5.4.0') {
        exclude module: 'support-v4'
    }

    implementation 'com.google.code.gson:gson:2.14.0'
    implementation "androidx.work:work-runtime:2.8.1"

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

}

repositories{
    flatDir{
        dirs 'libs'
    }
}
